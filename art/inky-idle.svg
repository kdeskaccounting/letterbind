<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Inky, a small plum squid holding a quill">
  <title>Inky</title>
  <defs>
    <linearGradient id="mantle" x1="30%" y1="4%" x2="72%" y2="100%">
      <stop offset="0" stop-color="#9a76cf"/>
      <stop offset="0.52" stop-color="#7a56ad"/>
      <stop offset="1" stop-color="#553673"/>
    </linearGradient>
    <linearGradient id="armFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8763ba"/>
      <stop offset="1" stop-color="#66458f"/>
    </linearGradient>
    <radialGradient id="belly" cx="50%" cy="42%" r="58%">
      <stop offset="0" stop-color="#c3a9e2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c3a9e2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ground" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000" stop-opacity="0.42"/>
      <stop offset="0.62" stop-color="#000" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f0899f" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#e8899f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- the shadow he sits in -->
  <ellipse cx="100" cy="180" rx="66" ry="14" fill="url(#ground)"/>

  <!-- eight short arms: the back four first, so the front four overlap them -->
  <g fill="none" stroke-linecap="round" stroke="#5b3b7a">
    <path d="M62 122C52 140 45 150 41 161" stroke-width="15"/>
    <path d="M138 122c10 18 17 28 21 39" stroke-width="15"/>
    <path d="M78 128c-8 16-12 26-14 38" stroke-width="15"/>
    <path d="M122 128c8 16 12 26 14 38" stroke-width="15"/>
  </g>

  <!-- the mantle: plump, round, no fins -->
  <path d="M100 24c38 0 60 28 60 64 0 30-24 48-60 48s-60-18-60-48c0-36 22-64 60-64z" fill="url(#mantle)"/>
  <ellipse cx="100" cy="104" rx="48" ry="32" fill="url(#belly)"/>
  <!-- candlelight catching the top-left of the mantle -->
  <path d="M52 74c4-18 15-33 30-39" fill="none" stroke="#ffe6bd" stroke-opacity="0.3" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M150 82c0-13-4-25-11-34" fill="none" stroke="#ffd9a0" stroke-opacity="0.16" stroke-width="4" stroke-linecap="round"/>

  <g fill="none" stroke-linecap="round" stroke="url(#armFront)">
    <path d="M90 130c-4 16-6 27-8 39" stroke-width="17"/>
    <path d="M110 130c4 16 6 27 8 39" stroke-width="17"/>
    <path d="M101 133c-2 16 0 26-4 38" stroke-width="17"/>
    <path d="M74 133c-10 15-12 29-1 33" stroke-width="16"/>
  </g>

  <!-- the quill he keeps under one arm, and the drop it just let go of -->
  <g transform="rotate(-18 66 146)">
    <path d="M62 161c-1-20 5-37 17-47 6 13 3 33-8 49z" fill="#f0cd6d"/>
    <path d="M68 159c0-16 4-29 11-38" fill="none" stroke="#b8862a" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M64 160l-3 9" fill="none" stroke="#c9922f" stroke-width="3" stroke-linecap="round"/>
  </g>
  <path d="M52 168c3 5 5 8 5 10a5 5 0 0 1-10 0c0-2 2-5 5-10z" fill="#3a2a52"/>

  <!-- the face -->

  <g opacity="1">
    <ellipse cx="58" cy="104" rx="11" ry="7" fill="url(#blush)"/>
    <ellipse cx="142" cy="104" rx="11" ry="7" fill="url(#blush)"/>
  </g>
  <g>
    <ellipse cx="80" cy="86" rx="17.0" ry="19.0" fill="#fdf8ef"/>
    <ellipse cx="120" cy="86" rx="17.0" ry="19.0" fill="#fdf8ef"/>
    <ellipse cx="83" cy="89" rx="9.0" ry="10.5" fill="#2b1e33"/>
    <ellipse cx="123" cy="89" rx="9.0" ry="10.5" fill="#2b1e33"/>
    <circle cx="79" cy="83" r="3.6" fill="#fff"/>
    <circle cx="119" cy="83" r="3.6" fill="#fff"/>
    <circle cx="87" cy="95" r="1.8" fill="#fff" fill-opacity="0.8"/>
    <circle cx="127" cy="95" r="1.8" fill="#fff" fill-opacity="0.8"/>
  </g>
  <path d="M91 111c4 6 14 6 18 0" fill="none" stroke="#2b1e33" stroke-width="3.2" stroke-linecap="round"/>
</svg>
